<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title></title><style>

.bee-popup-container, .bee-page-container { width: 100% !important; }
.bee-popup-row-content, .bee-row-content { max-width: 100% !important; }
img.bee-fullwidthOnMobile, img.bee-popup-autowidth { max-width: 100% !important; height: auto !important; }
/* beefree-popup-processor: modal mode — transparent body so scrim shows */
html, body { background: transparent !important; }
</style></head><body>
<div class="bee-popup-container">
	<style>
		.bee-popup-container div {
			margin: 0;
			padding: 0
		}

		.bee-popup-container img {
			border: 0
		}

			font-weight: 400
		}

		.bee-popup-container {
			color: #000000;
			font-family: Arial, Helvetica Neue, Helvetica, sans-serif
		}

		.bee-popup-container * {
			box-sizing: border-box
		}

		.bee-popup-container a {

		}

		.bee-popup-container .bee-popup-row {
			position: relative
		}

		.bee-popup-container .bee-popup-row-content {

		}

		}

		.bee-popup-row-1 {
			background-color: #57b5ec;
			background-repeat: no-repeat
		}

		.bee-popup-row-1 .bee-popup-row-content {
			background-repeat: no-repeat;

			color: #000000
		}

		.bee-popup-row-1 .bee-popup-col-1 {
			padding-bottom: 5px;
			padding-top: 5px
		}

		.bee-popup-row-1 .bee-popup-col-1 .bee-popup-block-3 {
			padding: 10px;
			text-align: center
		}

		.bee-popup-row-1 .bee-popup-col-1 .bee-popup-block-3 a {
			background-color: #000000;
			border-radius: 4px;
			color: #57b5ec;
			direction: ltr;
			font-family: inherit;
			font-size: 14px;
			font-weight: 400;
			letter-spacing: 0;
			line-height: 200%;
			padding: 5px 20px;
			width: auto
		}
	</style>
	<div class="bee-popup-rows-container">
		<div class="bee-popup-row bee-popup-row-1">
			<div class="bee-popup-row-content">
				<div class="bee-popup-col bee-popup-col-1 bee-popup-col-w12">
					<div class="bee-popup-block bee-popup-block-1 bee-popup-html-block">
						<div id="lmk-cd-wrap" style="font-family: Arial, sans-serif; text-align: center; padding: 12px 0; color: #111;">
							<div id="lmk-cd-label" style="font-size: 14px; font-weight: 600; margin-bottom: 8px; letter-spacing: 0.5px; text-transform: uppercase;">
								Offer ends in
							</div>
							<div id="lmk-cd-boxes" style="display: inline-flex; gap: 8px; justify-content: center;">
								<div style="background: #111827; color: #fff; border-radius: 8px; padding: 10px 12px; min-width: 56px;">
									<div id="lmk-cd-d" style="font-size: 22px; font-weight: 700; line-height: 1;">00</div>
									<div style="font-size: 10px; margin-top: 4px; opacity: 0.7;">DAYS</div>
								</div>
								<div style="background: #111827; color: #fff; border-radius: 8px; padding: 10px 12px; min-width: 56px;">
									<div id="lmk-cd-h" style="font-size: 22px; font-weight: 700; line-height: 1;">00</div>
									<div style="font-size: 10px; margin-top: 4px; opacity: 0.7;">HRS</div>
								</div>
								<div style="background: #111827; color: #fff; border-radius: 8px; padding: 10px 12px; min-width: 56px;">
									<div id="lmk-cd-m" style="font-size: 22px; font-weight: 700; line-height: 1;">00</div>
									<div style="font-size: 10px; margin-top: 4px; opacity: 0.7;">MIN</div>
								</div>
								<div style="background: #111827; color: #fff; border-radius: 8px; padding: 10px 12px; min-width: 56px;">
									<div id="lmk-cd-s" style="font-size: 22px; font-weight: 700; line-height: 1;">00</div>
									<div style="font-size: 10px; margin-top: 4px; opacity: 0.7;">SEC</div>
								</div>
							</div>
							<div id="lmk-cd-expired" style="display: none; font-size: 14px; color: #b91c1c; font-weight: 600; margin-top: 8px;">
								Offer expired
							</div>
						</div>
						<script>
							(function() {
								// Target time — edit this. ISO string is simplest.
								var target = new Date("2026-05-01T00:00:00").getTime();
								var d = document.getElementById("lmk-cd-d");
								var h = document.getElementById("lmk-cd-h");
								var m = document.getElementById("lmk-cd-m");
								var s = document.getElementById("lmk-cd-s");
								var boxes = document.getElementById("lmk-cd-boxes");
								var expired = document.getElementById("lmk-cd-expired");

								function pad(n) {
									return n < 10 ? "0" + n : "" + n;
								}

								function tick() {
									var diff = target - Date.now();
									if (diff <= 0) {
										if (boxes) boxes.style.display = "none";
										if (expired) expired.style.display = "block";
										clearInterval(t);
										return;
									}
									var ds = Math.floor(diff / 86400000);
									var hs = Math.floor((diff % 86400000) / 3600000);
									var ms = Math.floor((diff % 3600000) / 60000);
									var ss = Math.floor((diff % 60000) / 1000);
									if (d) d.textContent = pad(ds);
									if (h) h.textContent = pad(hs);
									if (m) m.textContent = pad(ms);
									if (s) s.textContent = pad(ss);
								}
								tick();
								var t = setInterval(tick, 1000);
							})();
						</script>
					</div>
					<div class="bee-popup-block bee-popup-block-2 bee-popup-addon"><img class="bee-popup-center bee-popup-autowidth" src="https://media3.giphy.com/media/v1.Y2lkPTIwZWI0ZTlkMjU2bjltaXdsYTVxZjlrM2M2dXNibmt3Nm9tdXhkbzBpdDBtem9hYyZlcD12MV9zdGlja2Vyc19zZWFyY2gmY3Q9cw/pU2nhizk3jg9png0z8/giphy.gif" style="max-width:315px;" alt="" title=""></div>
					<div class="bee-popup-block bee-popup-block-3 bee-popup-button"><a style="font-size: 14px; display: inline-block;" class="bee-popup-button-content" href="javascript:void(0)" onclick="LemniskInApp.cta('adcbdemo://payments', 'Garb it!'); return false;"><span style="word-break: break-word; font-size: 14px; line-height: 200%; letter-spacing: normal;">Garb it!</span></a></div>
				</div>
			</div>
		</div>
	</div>
</div>
<script>
(function () {
  // Cross-platform bridge — single window.LemniskInApp surface for both
  // iOS (WKScriptMessageHandler "LemniskInApp") and Android (@JavascriptInterface "LemniskInAppNative").
  // Falls back to console in browser preview so popups don't break outside the app.
  var bridge;
  if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.LemniskInApp) {
    var ios = window.webkit.messageHandlers.LemniskInApp;
    bridge = {
      cta:   function (d, l) { ios.postMessage({ action: "cta", deeplink: d, label: l }); },
      close: function ()     { ios.postMessage({ action: "close" }); },
      link:  function (u)    { ios.postMessage({ action: "link", url: u }); },
      form:  function (j)    {
        var data = {};
        try { data = JSON.parse(j); } catch (e) {}
        ios.postMessage({ action: "form", data: data });
      },
    };
  } else if (window.LemniskInAppNative) {
    var android = window.LemniskInAppNative;
    bridge = {
      cta:   function (d, l) { android.cta(d, l); },
      close: function ()     { android.close(); },
      link:  function (u)    { android.link(u); },
      form:  function (j)    { android.form(j); },
    };
  } else {
    bridge = {
      cta:   function (d, l) { console.log("[LemniskInApp] cta",   d, l); },
      close: function ()     { console.log("[LemniskInApp] close"); },
      link:  function (u)    { console.log("[LemniskInApp] link",  u); },
      form:  function (j)    { console.log("[LemniskInApp] form",  j); },
    };
  }
  window.LemniskInApp = bridge;

  // Hook every <form> on the page: capture the submit, serialize inputs,
  // deliver to the native side as JSON.
  function hookForms() {
    var forms = document.querySelectorAll("form");
    for (var i = 0; i < forms.length; i++) {
      forms[i].addEventListener("submit", function (e) {
        e.preventDefault();
        var data = {};
        var inputs = this.querySelectorAll("input, select, textarea");
        for (var j = 0; j < inputs.length; j++) {
          var el = inputs[j];
          if (el.type === "submit" || el.type === "button") continue;
          var key = el.name || el.id || ("field" + j);
          data[key] = el.value;
        }
        window.LemniskInApp.form(JSON.stringify(data));
      });
    }
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", hookForms);
  } else {
    hookForms();
  }
})();
</script></body></html>
