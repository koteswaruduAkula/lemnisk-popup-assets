<script>
(function () {
  // Cross-platform bridge — single window.LemniskInApp surface for both
  // iOS (WKScriptMessageHandler "LemniskInApp") and Android (@JavascriptInterface "LemniskInAppNative").
  // Falls back to console in browser preview so popups don't break outside the app.
  var bridge;
  if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.LemniskInApp) {
    var ios = window.webkit.messageHandlers.LemniskInApp;
    bridge = {
      cta:   function (d, l) { ios.postMessage({ action: "cta", deeplink: d, label: l }); },
      close: function ()     { ios.postMessage({ action: "close" }); },
      link:  function (u)    { ios.postMessage({ action: "link", url: u }); },
      form:  function (j)    {
        var data = {};
        try { data = JSON.parse(j); } catch (e) {}
        ios.postMessage({ action: "form", data: data });
      },
    };
  } else if (window.LemniskInAppNative) {
    var android = window.LemniskInAppNative;
    bridge = {
      cta:   function (d, l) { android.cta(d, l); },
      close: function ()     { android.close(); },
      link:  function (u)    { android.link(u); },
      form:  function (j)    { android.form(j); },
    };
  } else {
    bridge = {
      cta:   function (d, l) { console.log("[LemniskInApp] cta",   d, l); },
      close: function ()     { console.log("[LemniskInApp] close"); },
      link:  function (u)    { console.log("[LemniskInApp] link",  u); },
      form:  function (j)    { console.log("[LemniskInApp] form",  j); },
    };
  }
  window.LemniskInApp = bridge;

  // Hook every <form> on the page: capture the submit, serialize inputs,
  // deliver to the native side as JSON.
  function hookForms() {
    var forms = document.querySelectorAll("form");
    for (var i = 0; i < forms.length; i++) {
      forms[i].addEventListener("submit", function (e) {
        e.preventDefault();
        var data = {};
        var inputs = this.querySelectorAll("input, select, textarea");
        for (var j = 0; j < inputs.length; j++) {
          var el = inputs[j];
          if (el.type === "submit" || el.type === "button") continue;
          var key = el.name || el.id || ("field" + j);
          data[key] = el.value;
        }
        window.LemniskInApp.form(JSON.stringify(data));
      });
    }
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", hookForms);
  } else {
    hookForms();
  }
})();
</script></body></html>
