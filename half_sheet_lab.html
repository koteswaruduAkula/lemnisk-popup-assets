<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>
html,body{margin:0;padding:0;height:100%;overflow:hidden;font-family:-apple-system,Roboto,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
body{background:#fbf4f1;color:#2b2320}
.hero{height:170px;background:linear-gradient(135deg,#f6d9cf 0%,#ead0c6 100%);display:flex;align-items:center;justify-content:center}
.ph{width:88px;height:70px;border:4px solid #c9a79c;border-radius:10px;position:relative}
.ph:after{content:"";position:absolute;left:10px;bottom:8px;width:52px;height:30px;background:#c9a79c;clip-path:polygon(0 100%,35% 20%,60% 65%,75% 45%,100% 100%)}
.txt{padding:18px 20px 16px}
.title{font-size:20px;font-weight:700;line-height:1.25;margin:0 0 8px}
.body{font-size:14px;line-height:1.45;color:#5b4f4a;margin:0}
.cta{display:block;background:#e0683f;color:#fff;text-decoration:none;text-align:center;padding:16px;font-weight:700;font-size:16px}
</style></head><body>
<div class="hero"><div class="ph"></div></div>
<div class="txt"><p class="title">Get 5% cashback this weekend</p><p class="body">Use your card at any partner store and the cashback lands in your account by Monday. No code needed.</p></div>
<a class="cta" href="#" onclick="lmkCta('https://lemnisk.co/offers','Claim now');return false;">Claim now</a>
<script>
function lmkCta(u,l){if(window.LemniskInAppNative){LemniskInAppNative.cta(u,l)}else if(window.LemniskInApp){LemniskInApp.cta(u,l)}}
</script></body></html>
