<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title></title><style>

</style></head><body>

		}

		}

		.bee-popup-container .bee-popup-row {

		}

		.bee-popup-container .bee-popup-row-content {

		}

		.bee-popup-container .bee-popup-row-content .bee-popup-col-w6 {

		}

		.bee-popup-container .bee-popup-row-content .bee-popup-col-w12 {

		}

		.bee-popup-button a {
			text-decoration: none
		}

		.bee-popup-button-content {
			text-align: center
		}

		.bee-popup-addon {
			overflow: auto
		}

		.bee-popup-addon .bee-popup-center {

		}

		.bee-popup-row-1 .bee-popup-col-1 .bee-popup-block-1 {

		}

		.bee-popup-row-1 .bee-popup-row-content,
		.bee-popup-row-2 .bee-popup-row-content {

			border-radius: 0;
			color: #000000
		}

		.bee-popup-row-2 .bee-popup-col-1 .bee-popup-block-1 a,
		.bee-popup-row-2 .bee-popup-col-2 .bee-popup-block-1 a {
			border-radius: 4px;
			color: #ffffff;
			direction: ltr;
			font-family: inherit;
			font-size: 14px;
			font-weight: 400;
			letter-spacing: 0;
			line-height: 200%;
			padding: 5px 20px;
			width: auto
		}

		.bee-popup-addon img {
			display: block;
			width: 100%
		}

		.bee-popup-row-1 {
			background-repeat: no-repeat
		}

		.bee-popup-row-1 .bee-popup-col-1 {
			padding-bottom: 5px;
			padding-top: 5px
		}

		.bee-popup-row-2 {

		}

		.bee-popup-row-2 .bee-popup-col-1 {
			border-right: 0px solid #3713ad;

		}

		.bee-popup-row-2 .bee-popup-col-1 .bee-popup-block-1,
		.bee-popup-row-2 .bee-popup-col-2 .bee-popup-block-1 {

		.bee-popup-row-2 .bee-popup-col-2 {

	<div class="bee-popup-rows-container">

					<div class="bee-popup-block bee-popup-block-1 bee-popup-button"><a style="font-size: 14px; display: inline-block;" class="bee-popup-button-content" href="javascript:void(0)" onclick="LemniskInApp.cta('adcbdemo://home', 'Grab the offer!'); return false;"><span style="word-break: break-word; font-size: 14px; line-height: 200%; letter-spacing: normal;">Grab the offer!</span></a></div>
				</div>
				<div class="bee-popup-col bee-popup-col-2 bee-popup-col-w6">
					<div class="bee-popup-block bee-popup-block-1 bee-popup-button"><a style="font-size: 14px; display: inline-block;" class="bee-popup-button-content" href="javascript:void(0)" onclick="LemniskInApp.close(); return false;"><span style="word-break: break-word; font-size: 14px; line-height: 200%; letter-spacing: normal;">Dismiss</span></a></div>
				</div>
			</div>
		</div>
	</div>
</div>
<script>
(function () {
  // Cross-platform bridge — single window.LemniskInApp surface for both
  // iOS (WKScriptMessageHandler "LemniskInApp") and Android (@JavascriptInterface "LemniskInAppNative").
  // Falls back to console in browser preview so popups don't break outside the app.
  var bridge;
  if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.LemniskInApp) {
    var ios = window.webkit.messageHandlers.LemniskInApp;
    bridge = {
      cta:   function (d, l) { ios.postMessage({ action: "cta", deeplink: d, label: l }); },
      close: function ()     { ios.postMessage({ action: "close" }); },
      link:  function (u)    { ios.postMessage({ action: "link", url: u }); },
      form:  function (j)    {
        var data = {};
        try { data = JSON.parse(j); } catch (e) {}
        ios.postMessage({ action: "form", data: data });
      },
    };
  } else if (window.LemniskInAppNative) {
    var android = window.LemniskInAppNative;
    bridge = {
      cta:   function (d, l) { android.cta(d, l); },
      close: function ()     { android.close(); },
      link:  function (u)    { android.link(u); },
      form:  function (j)    { android.form(j); },
    };
  } else {
    bridge = {
      cta:   function (d, l) { console.log("[LemniskInApp] cta",   d, l); },
      close: function ()     { console.log("[LemniskInApp] close"); },
      link:  function (u)    { console.log("[LemniskInApp] link",  u); },
      form:  function (j)    { console.log("[LemniskInApp] form",  j); },
    };
  }
  window.LemniskInApp = bridge;

  // Hook every <form> on the page: capture the submit, serialize inputs,
  // deliver to the native side as JSON.
  function hookForms() {
    var forms = document.querySelectorAll("form");
    for (var i = 0; i < forms.length; i++) {
      forms[i].addEventListener("submit", function (e) {
        e.preventDefault();
        var data = {};
        var inputs = this.querySelectorAll("input, select, textarea");
        for (var j = 0; j < inputs.length; j++) {
          var el = inputs[j];
          if (el.type === "submit" || el.type === "button") continue;
          var key = el.name || el.id || ("field" + j);
          data[key] = el.value;
        }
        window.LemniskInApp.form(JSON.stringify(data));
      });
    }
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", hookForms);
  } else {
    hookForms();
  }
})();
</script></body></html>
